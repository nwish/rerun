name: Build and publish container

on:
  # Manual run: publishes an image tagged with the commit SHA only (never "latest").
  workflow_dispatch:
  # Release: pushing a version tag (v0.1.0, v1.2.3, v0.2.0-rc.1) publishes semver tags.
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/rerun
          # v1.2.3 -> 1.2.3, 1.2, 1, latest. Pre-releases (v1.2.3-rc.1) get only their exact
          # version, never latest. Major version zero gets no "0" tag (0.y.z can break at any time).
          # Manual runs have no tag, so they only get the sha tag.
          tags: |
            type=sha,format=long,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}

      - name: Publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Keep only three newest SHA-only versions; preserve releases and untagged manifests.
      - name: Prune old SHA-only image versions
        uses: actions/github-script@v8
        env:
          GHCR_CLEANUP_PACKAGES: rerun
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const packageType = 'container';
            const packageNames = process.env.GHCR_CLEANUP_PACKAGES.split(',').filter(Boolean);
            for (const packageName of packageNames) {
              const versions = await github.paginate(
                github.rest.packages.getAllPackageVersionsForPackageOwnedByUser,
                { username: owner, package_type: packageType, package_name: packageName, per_page: 100 }
              );
              // A semver/latest tag on the same digest protects the entire version.
              // Untagged versions (including multi-platform child manifests) are untouched.
              const candidates = versions.filter(v => {
                const tags = v.metadata?.container?.tags ?? [];
                return tags.length === 1 && /^sha-[a-f0-9]{7,40}$/.test(tags[0]);
              }).sort((a, b) =>
                Date.parse(b.created_at) - Date.parse(a.created_at) || b.id - a.id
              );
              core.info(`${packageName}: ${candidates.length} SHA-only versions; retaining newest 3.`);
              for (const version of candidates.slice(3)) {
                core.info(`Deleting ${packageName} ${version.metadata.container.tags[0]} (version ${version.id})`);
                await github.rest.packages.deletePackageVersionForUser({
                  username: owner,
                  package_type: packageType,
                  package_name: packageName,
                  package_version_id: version.id,
                });
              }
            }
